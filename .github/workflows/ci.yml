name: CI
on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_LOCAL_INFRA: "1"
      DATABASE_URL: "postgresql://sharkpark:sharkpark@localhost:5432/sharkpark?schema=public"
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sharkpark
          POSTGRES_PASSWORD: sharkpark
          POSTGRES_DB: sharkpark
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U sharkpark"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install

      # Security gate: block on known high+ vulnerabilities. Production deps only —
      # devDependencies (jest, eslint, etc.) are not shipped, and Dependabot
      # opens PRs for them on its own weekly cadence.
      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level=high

      - name: Run database migrations
        run: pnpm db:deploy

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Seed test data
        run: pnpm db:seed

      - name: Build all packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test -- --coverage

      - name: Backend E2E tests
        timeout-minutes: 15
        run: pnpm -C apps/backend test:e2e

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ios-build:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    needs: ci
    
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # NOTE: exact-match only (no restore-keys). Pods/Local Podspecs is keyed
      # by Podfile.lock content; restoring a stale prefix-matched cache from a
      # different lockfile makes `pod install` fail with "version of the
      # dependency ... differs from the version stored in `Pods/Local Podspecs`"
      # (e.g. when a PR's RN version differs from a previously-cached one).
      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}

      - name: Install dependencies
        run: pnpm install

      - name: Install CocoaPods
        run: cd apps/mobile/ios && pod install

      - name: Build iOS (Simulator)
        run: |
          cd apps/mobile/ios
          xcodebuild build \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
