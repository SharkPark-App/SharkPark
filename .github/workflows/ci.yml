name: CI
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SKIP_LOCAL_INFRA: "1"
      DATABASE_URL: "postgresql://sharkpark:sharkpark@localhost:5432/sharkpark?schema=public"
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sharkpark
          POSTGRES_PASSWORD: sharkpark
          POSTGRES_DB: sharkpark
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U sharkpark"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install

      - name: Run database migrations
        run: pnpm db:deploy

      - name: Seed test data
        run: pnpm db:seed

      - name: Build all packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test -- --coverage

      - name: Backend E2E tests
        run: pnpm -C apps/backend test:e2e

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ios-build:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    needs: ci
    
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install dependencies
        run: pnpm install

      - name: Install CocoaPods
        run: cd apps/mobile/ios && pod install

      - name: Build iOS (Simulator)
        run: |
          cd apps/mobile/ios
          xcodebuild build \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
