name: CI

# Principle of least privilege for the GITHUB_TOKEN. Job-level overrides
# can widen this if a future job needs to comment on PRs or upload artifacts.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_LOCAL_INFRA: "1"
      DATABASE_URL: "postgresql://sharkpark:sharkpark@localhost:5432/sharkpark?schema=public"
      # AZURE_CLIENT_ID and AZURE_TENANT_ID are intentionally omitted here.
      # azure.strategy.ts has real development fallback values that are used
      # when these vars are absent; overriding them with dummy UUIDs would
      # point the JWKS endpoint at a non-existent tenant and break auth.
      # Passport still returns 401 for unauthenticated requests without ever
      # contacting Microsoft (short-circuits at the missing Bearer token step).
      DEVICE_HASH_SALT: "ci-test-salt"
      DEVICE_EVENT_SECRET: "ci-test-secret"
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sharkpark
          POSTGRES_PASSWORD: sharkpark
          POSTGRES_DB: sharkpark
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U sharkpark"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install

      # Block deploys with placeholder values still in the universal-link manifests.
      # These files are served from the marketing site and feed Apple's CDN +
      # Google's Domain Verification Service. Shipping a placeholder fingerprint
      # silently breaks all deep links — fail loudly here instead.
      - name: Validate .well-known deep-link manifests
        run: |
          set -euo pipefail
          AASA="apps/marketing/public/.well-known/apple-app-site-association"
          AL="apps/marketing/public/.well-known/assetlinks.json"

          # 1. Both files must exist
          test -f "$AASA" || { echo "::error::missing $AASA"; exit 1; }
          test -f "$AL"   || { echo "::error::missing $AL"; exit 1; }

          # 2. Both files must be valid JSON
          python3 -m json.tool "$AASA" >/dev/null
          python3 -m json.tool "$AL"   >/dev/null

          # 3. No placeholder strings
          if grep -qE 'REPLACE_WITH_|TEAMID|RELEASE_SHA256_FINGERPRINT_REPLACE' "$AASA" "$AL"; then
            echo "::error::placeholder string found in .well-known manifests — fill in real values before merge"
            grep -nE 'REPLACE_WITH_|TEAMID|RELEASE_SHA256_FINGERPRINT_REPLACE' "$AASA" "$AL" || true
            exit 1
          fi

          # 4. Every Android SHA-256 fingerprint must match the expected format
          python3 - <<'PY'
          import json, re, sys
          data = json.load(open("apps/marketing/public/.well-known/assetlinks.json"))
          pattern = re.compile(r'^[0-9A-F]{2}(:[0-9A-F]{2}){31}$')
          for stmt in data:
              for fp in stmt["target"].get("sha256_cert_fingerprints", []):
                  if not pattern.match(fp):
                      print(f"::error::invalid SHA-256 fingerprint in assetlinks.json: {fp}")
                      sys.exit(1)
          print("All SHA-256 fingerprints valid.")
          PY

          # 5. AASA appID must be TEAMID.bundleId (10 alphanumeric, dot, reverse-DNS)
          python3 - <<'PY'
          import json, re, sys
          data = json.load(open("apps/marketing/public/.well-known/apple-app-site-association"))
          pattern = re.compile(r'^[A-Z0-9]{10}\.[a-zA-Z0-9.\-]+$')
          for d in data["applinks"]["details"]:
              if not pattern.match(d["appID"]):
                  print(f"::error::invalid AASA appID: {d['appID']}")
                  sys.exit(1)
          print("AASA appID format valid.")
          PY

      # Security gate: block on known high+ vulnerabilities. Production deps only —
      # devDependencies (jest, eslint, etc.) are not shipped, and Dependabot
      # opens PRs for them on its own weekly cadence.
      - name: Audit production dependencies (high+)
        run: pnpm audit --prod --audit-level=high

      - name: Run database migrations
        run: pnpm db:deploy

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Seed test data
        run: pnpm db:seed

      - name: Build all packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test -- --coverage

      - name: Backend E2E tests
        timeout-minutes: 15
        run: pnpm -C apps/backend test:e2e

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ios-build:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    needs: ci
    
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # NOTE: exact-match only (no restore-keys). Pods/Local Podspecs is keyed
      # by Podfile.lock content; restoring a stale prefix-matched cache from a
      # different lockfile makes `pod install` fail with "version of the
      # dependency ... differs from the version stored in `Pods/Local Podspecs`"
      # (e.g. when a PR's RN version differs from a previously-cached one).
      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}

      - name: Install dependencies
        run: pnpm install

      - name: Install CocoaPods
        run: cd apps/mobile/ios && pod install

      - name: Build iOS (Simulator)
        run: |
          cd apps/mobile/ios
          xcodebuild build \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

  android-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: ci

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: pnpm install

      - name: Build Android (assembleDebug)
        run: |
          cd apps/mobile/android
          ./gradlew assembleDebug --no-daemon --stacktrace
