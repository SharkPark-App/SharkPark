name: Deploy marketing site to Cloudflare Workers

# Principle of least privilege for the GITHUB_TOKEN — deploys to Cloudflare
# use CLOUDFLARE_API_TOKEN; GITHUB_TOKEN only reads the repo for checkout.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-marketing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Wrangler 4.x requires Node >= 22. Matches all other workflows.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketing site
        run: pnpm --filter @sharkpark/marketing build

      - name: Deploy to Cloudflare Workers
        # The marketing site is a Workers project with static assets
        # (see apps/marketing/wrangler.jsonc — uses `assets.directory`,
        # the modern Workers Static Assets pattern, NOT Cloudflare Pages).
        # Config (name, compatibility_date, assets dir) lives in wrangler.jsonc.
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
