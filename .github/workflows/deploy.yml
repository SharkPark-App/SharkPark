name: Deploy to Fly

# Principle of least privilege for the GITHUB_TOKEN — deploys to Fly use
# FLY_API_TOKEN; the GITHUB_TOKEN only needs to read the repo for checkout.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "services/ml/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install backend deps
        run: pnpm install --filter @sharkpark/backend... --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run Prisma migrations
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          # Concurrency group above serializes deploys, so we don't need
          # Prisma's advisory lock (which would fail on pgbouncer anyway).
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: |
          # Force pooled endpoint (always reachable; direct endpoint can be
          # suspended on Neon free tier) and add pgbouncer=true so Prisma uses
          # the simple protocol that survives transaction-mode pooling.
          DATABASE_URL=$(node -e '
            const u = new URL(process.env.NEON_DATABASE_URL);
            if (!u.hostname.includes("-pooler.")) {
              u.hostname = u.hostname.replace(/^(ep-[^.]+)\./, "$1-pooler.");
            }
            u.searchParams.set("pgbouncer", "true");
            u.searchParams.set("connection_limit", "1");
            u.searchParams.set("connect_timeout", "60");
            console.log(u.toString());
          ')
          export DATABASE_URL
          echo "Migrating against pooled endpoint: ${DATABASE_URL%%@*}@***"
          pnpm db:deploy

      # Seed reference data (school + 28 lots + buildings + geofences +
      # advisories) AFTER migrations succeed. seed-prod.ts is fully idempotent:
      # pure upsert, never deletes rows, and intentionally excludes
      # current_occupancy from the update payload so live state is preserved.
      # Running this every deploy keeps the DB in sync with lot-data.ts +
      # the *.generated.ts polygons whenever they change in source control.
      # Required: NEON_DATABASE_URL (same secret used above). Missing secret =
      # failed deploy, by design.
      - name: Seed production reference data
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          DATABASE_URL=$(node -e '
            const u = new URL(process.env.NEON_DATABASE_URL);
            if (!u.hostname.includes("-pooler.")) {
              u.hostname = u.hostname.replace(/^(ep-[^.]+)\./, "$1-pooler.");
            }
            u.searchParams.set("pgbouncer", "true");
            u.searchParams.set("connection_limit", "1");
            u.searchParams.set("connect_timeout", "60");
            console.log(u.toString());
          ')
          export DATABASE_URL
          echo "Seeding against pooled endpoint: ${DATABASE_URL%%@*}@***"
          pnpm --filter @sharkpark/backend db:seed:prod

      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          # Pin flyctl: `setup-flyctl@master` with no version installs an
          # older default whose `flyctl machine list` rejects `-j/--json`,
          # which broke the post-deploy `Ensure cron Machine started` step
          # in PR #196 (workflow run 25405252314, exit 5: "unknown flag:
          # --json"). 0.4.47 supports `-j/--json` on `machine list`. Note
          # `machine status` never accepted `--json` (only
          # `-d/--display-config` for config-only output) — we therefore
          # read state directly from the `machine list -j` output.
          version: 0.4.47

      # ─── Sentry release tagging (P10.94) ────────────────────────────────
      # Build backend locally to produce dist/ + .js.map files, then create
      # a Sentry release tagged `sharkpark-backend@<short-sha>` and upload
      # sourcemaps. The release ID is then injected into the running container
      # via a staged Fly secret so the next deploy picks it up atomically.
      #
      # Required GitHub secrets (deploy fails loudly if any are missing —
      # release tagging is a release-engineering correctness requirement,
      # not optional observability):
      #   SENTRY_AUTH_TOKEN  Internal-integration token, scopes:
      #                      project:releases + org:read
      #   SENTRY_ORG         Sentry organization slug
      #   SENTRY_PROJECT     Sentry project slug (e.g. sharkpark-backend)
      - name: Compute release identifier
        id: release
        run: echo "id=sharkpark-backend@$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build backend (for sourcemaps)
        run: pnpm --filter @sharkpark/backend run build

      - name: Create Sentry release & upload sourcemaps
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ steps.release.outputs.id }}
          sourcemaps: ./apps/backend/dist
          url_prefix: "~/dist"
          ignore_missing: true

      - name: Stage SENTRY_RELEASE on Fly
        # --stage defers the restart so the next `flyctl deploy` applies the
        # secret atomically with the new image. Without --stage, the running
        # instance would restart twice.
        run: |
          flyctl secrets set --stage --config apps/backend/fly.toml \
            SENTRY_RELEASE="${{ steps.release.outputs.id }}"

      - name: Deploy
        run: flyctl deploy --remote-only --config apps/backend/fly.toml --dockerfile apps/backend/Dockerfile

      - name: Ensure cron Machine started
        # Rolling deploys preserve each Machine's prior desired state. If the
        # cron Machine previously crash-looped past Fly's retry budget and
        # ended up Stopped (see PR #192/#195), shipping a new image will NOT
        # bring it back up — the scheduler stays silently down. Force-start
        # any cron Machine that isn't already running. Idempotent: starting
        # an already-started Machine is a no-op.
        #
        # `flyctl machine status` does NOT accept `-j/--json` (only
        # `-d/--display-config` which prints config, not state). Earlier
        # versions silently ignored the unknown flag; flyctl 0.4.47 errors
        # with "unknown flag: --json" and aborts the step. The objects
        # returned by `machine list -j` already include `.state`, so we read
        # both id and state from a single list call and skip per-machine
        # status lookups entirely.
        run: |
          set -euo pipefail
          mapfile -t entries < <(flyctl machine list \
            --config apps/backend/fly.toml \
            -j | jq -r '.[] | select(.config.metadata.fly_process_group == "cron") | "\(.id) \(.state)"')
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::warning::No cron Machines found; skipping start."
            exit 0
          fi
          for entry in "${entries[@]}"; do
            id="${entry%% *}"
            state="${entry#* }"
            echo "cron Machine $id state=$state"
            if [ "$state" != "started" ]; then
              echo "Starting cron Machine $id..."
              flyctl machine start "$id" --config apps/backend/fly.toml
            fi
          done
