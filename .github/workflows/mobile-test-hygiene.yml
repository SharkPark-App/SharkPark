name: Mobile Test Hygiene

permissions:
  contents: read

on:
  pull_request:
  schedule:
    # 11:00 UTC daily
    - cron: '0 11 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  mobile-test-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 10.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run mobile test hygiene checks
        run: pnpm --filter mobile test:hygiene
