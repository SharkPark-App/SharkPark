name: Restore Test (P7.78)

# Principle of least privilege for the GITHUB_TOKEN.
permissions:
  contents: read

# Validates the entire backup → restore loop works end-to-end. This is the
# automated version of the monthly drill in docs/runbooks/runbook.md.
#
# Schedule: Sundays 13:00 UTC (06:00 PT) — runs after Saturday's daily backup
# (which happens at 02:00 PT / 10:00 UTC), so we always test against fresh
# data. Also available on workflow_dispatch.
#
# Cost: ~10 GH Actions minutes per run. Neon: a transient branch (deleted at
# end), no compute beyond the restore itself. R2: 1 GET request + egress
# of the dump.
#
# Required GH secrets (all required — workflow fails loudly if any are missing):
#   NEON_API_KEY
#   R2_ACCOUNT_ID
#   BACKUP_R2_ACCESS_KEY_ID
#   BACKUP_R2_SECRET_ACCESS_KEY
#   R2_BACKUPS_BUCKET         (value: "sharkpark-backups")
# Required GH vars:
#   NEON_PROJECT_ID

on:
  schedule:
    - cron: "0 13 * * 0"  # Sundays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  restore_test:
    name: Restore latest backup to throwaway Neon branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify required secrets and vars are configured
        env:
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          R2_BACKUPS_BUCKET: ${{ secrets.R2_BACKUPS_BUCKET }}
        run: |
          missing=()
          [ -z "$NEON_PROJECT_ID" ]      && missing+=("vars.NEON_PROJECT_ID")
          [ -z "$NEON_API_KEY" ]         && missing+=("secrets.NEON_API_KEY")
          [ -z "$R2_ACCOUNT_ID" ]        && missing+=("secrets.R2_ACCOUNT_ID")
          [ -z "$BACKUP_R2_ACCESS_KEY_ID" ]     && missing+=("secrets.BACKUP_R2_ACCESS_KEY_ID")
          [ -z "$BACKUP_R2_SECRET_ACCESS_KEY" ] && missing+=("secrets.BACKUP_R2_SECRET_ACCESS_KEY")
          [ -z "$R2_BACKUPS_BUCKET" ]    && missing+=("secrets.R2_BACKUPS_BUCKET")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Required configuration is missing: ${missing[*]}" >&2
            echo "Configure these in repository Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          echo "All required secrets and vars are present."

      # postgresql-client-17 — pg_restore must be ≥ Neon's PG version (17).
      # Ubuntu 24.04 runner ships PG16 by default, so add the PGDG repo.
      - name: Install postgresql-client-17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_restore --version

      - name: Compute branch name + expiration
        id: name
        run: |
          echo "branch=restore-test-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          # 1-day TTL is a safety net — the cleanup step at job end normally
          # deletes the branch. Neon GCs after expires_at if cleanup fails.
          echo "expires=$(date -u -d '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # Create a transient Neon branch from main. expires_at is defense in
      # depth in case the cleanup step at the end fails — Neon will GC it
      # automatically after 1 day.
      - name: Create transient Neon branch
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.name.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.name.outputs.expires }}

      # Find the latest dump in R2 by listing daily/ and taking the newest.
      # Uses awscli with R2's S3-compatible endpoint.
      - name: Locate latest backup in R2
        id: dump
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BACKUPS_BUCKET }}
        run: |
          set -euo pipefail
          latest=$(aws --endpoint-url "$R2_ENDPOINT" s3 ls "s3://$BUCKET/daily/" \
                   | awk '{print $4}' | grep -E '\.dump\.gz$' | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "ERROR: no daily/*.dump.gz objects found in R2 bucket $BUCKET" >&2
            exit 1
          fi
          echo "Latest dump: $latest"
          aws --endpoint-url "$R2_ENDPOINT" s3 cp "s3://$BUCKET/daily/$latest" ./restore.dump.gz
          gunzip restore.dump.gz
          ls -lh restore.dump
          echo "key=$latest" >> "$GITHUB_OUTPUT"

      # Restore into the transient branch. Same flags as the runbook:
      # --no-owner --no-privileges --clean --if-exists. Use the unpooled URL
      # because pgbouncer in transaction mode chokes on multi-statement DDL.
      - name: pg_restore into transient branch
        env:
          TARGET_URL: ${{ steps.branch.outputs.db_url }}
        run: |
          set -euo pipefail
          # Wipe schema (matches runbook procedure)
          psql "$TARGET_URL" -c 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'
          # Single-job for atomicity (small DB)
          pg_restore --no-owner --no-privileges --clean --if-exists \
                     --jobs 1 --dbname "$TARGET_URL" ./restore.dump

      # Sanity queries. Fail loudly if critical tables are empty — that
      # would mean the backup is structurally valid but missing data.
      - name: Verify row counts
        env:
          TARGET_URL: ${{ steps.branch.outputs.db_url }}
        run: |
          set -euo pipefail
          psql "$TARGET_URL" -At -c 'SELECT count(*) FROM "Lot";' > /tmp/lot_count
          psql "$TARGET_URL" -At -c 'SELECT count(*) FROM "OccupancySnapshot";' > /tmp/snap_count
          lot_count=$(cat /tmp/lot_count)
          snap_count=$(cat /tmp/snap_count)
          echo "Lot rows:               $lot_count"
          echo "OccupancySnapshot rows: $snap_count"
          # Lot is the bedrock — should always be > 0 in a valid backup.
          if [ "$lot_count" -eq 0 ]; then
            echo "FAIL: Lot table is empty — backup may be corrupt or pre-seed" >&2
            exit 1
          fi
          # Snapshots can be 0 only on a fresh install (first backup ever).
          # Once we've been live for a few days this should always be > 0.
          # Warn but don't fail in case we ever restore-test a pre-launch backup.
          if [ "$snap_count" -eq 0 ]; then
            echo "WARN: OccupancySnapshot is empty — expected for pre-launch only"
          fi
          echo "Restore test PASSED. Backup ${{ steps.dump.outputs.key }} is restorable."

      # Always delete the transient branch, even on failure.
      - name: Delete transient Neon branch
        if: ${{ always() && steps.branch.outcome == 'success' }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.name.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
