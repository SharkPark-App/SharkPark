# fly.toml — sharkpark-api (https://fly.io/apps/sharkpark-api)
#
# Two process groups, one image:
#   app  — Nest HTTP server, autostop enabled (min=1, keeps one warm)
#   cron — long-running NestJS scheduler process (`scheduler-main.ts`).
#          Holds ONE Nest application context whose @nestjs/schedule
#          ScheduleModule registers every @Cron(...) job class as an
#          in-process timer. Replaces the old supercronic + per-script
#          Nest bootstrap pattern, which OOM-cascaded the cron VM at
#          the top of every 15-minute slot (5 children × ~180MB Nest
#          boot > 1GB). Steady-state RSS ~250MB regardless of how many
#          ticks fire concurrently, so cron VM is sized down to 512MB.
#
# Deploy from repo root: fly deploy --config apps/backend/fly.toml
# Reference: https://fly.io/docs/reference/configuration/

app = 'sharkpark-api'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Migrations run from the GitHub Actions runner (see .github/workflows/deploy.yml)
  # before flyctl deploy. The CI runner has stable connectivity to Neon's pooler,
  # whereas the release_command machine on Fly intermittently fails to reach the
  # direct endpoint when the Neon compute is suspended. The deploy workflow's
  # concurrency group serializes deploys, so we don't need Prisma's advisory lock.
  strategy = 'rolling'

[env]
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'
  PORT = '3000'
  # Wall-clock crontab entries (e.g. '0 3 * * *') trigger at 3 AM PT.
  TZ = 'America/Los_Angeles'

[processes]
  app = 'node dist/main.js'
  cron = 'node dist/scheduler-main.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm at all times. min=0 saves ~$1–2/mo but the ~10s
  # cold start on the first request after idle (measured 2026-04-26:
  # 10.7s TTFB; warm p95 ~0.28s — Fly boot + Node/Nest start + Prisma->Neon
  # cold connect) was unacceptable for the mobile UX (no loading skeleton
  # plausibly hides 10s) and was generating false-positive Better Stack
  # alerts (PR03/PM05 502s when the uptime probe was the request that woke
  # the machine). With min=1 the second machine still autostops after idle
  # so we don't pay double during low traffic. See docs/runbooks/runbook.md.
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    # grace_period applies on machine boot only (deploys, crash recovery,
    # scale-up of the second machine — not steady-state requests, since
    # min_machines_running = 1 keeps one warm). Boot is ~10-15s end-to-end
    # (Fly boot + Node + Nest module graph + Prisma connect to Neon); a
    # 10s grace previously tripped Fly Doctor's "App not listening on port
    # 3000" alert because the live probe fired before bootstrap finished.
    # 30s gives headroom and matches the ready check below.
    grace_period = '30s'
    method = 'GET'
    path = '/api/v1/health/live'
    protocol = 'http'

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    # See note on the live check above — 30s covers cold boot during
    # deploys / crash recovery, not steady-state.
    grace_period = '30s'
    method = 'GET'
    path = '/api/v1/health/ready'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  # Single long-running NestJS scheduler process. Application context is
  # built ONCE at boot (~250MB RSS — Prisma + all feature modules), and
  # every @Cron(...) tick reuses it. There is no per-tick bootstrap, so
  # concurrent ticks at the top of the hour cost essentially nothing and
  # cannot OOM-cascade the way the old supercronic + per-script Nest
  # pattern did (5 × ~180MB > 1GB → exit 137 on survivors).
  #
  # Heavy ML jobs (predict-all-lots, retrain-models) spawn Python in a
  # CHILD process — their xgboost/pandas memory lives outside this VM's
  # accounting once Fly schedules them on their own machine, but a single
  # in-process child push can transiently spike to ~700MB. If/when those
  # land back on this process group, bump back to 1024mb.
  memory = '512mb'
  processes = ['cron']

# Restart policies. The `app` group keeps Fly's default (`on-failure`, 10
# retries) — http_service health checks already gate routing, so a hard
# loop just gets pulled out of the LB.
#
# The `cron` group gets `policy = "always"` because it has no http_service
# and therefore no auto-start trigger. If the Machine ever exits the retry
# budget and lands in a terminal Stopped state (as happened after the
# WeatherFetchService DI bug in PR #192 — Fly retried 10 times in ~30s
# and gave up, leaving the Machine stopped), a subsequent rolling deploy
# preserves that desired-state and ships the new image WITHOUT starting
# the Machine. The scheduler then silently stays down until someone runs
# `fly machine start` by hand. With `always`, every Machine exit triggers
# a restart attempt regardless of exit code, and a healthy redeploy will
# re-enter the started state.
#
# NOTE: `retries` is still bounded; this is not a substitute for fixing
# the underlying crash. The post-deploy `Ensure cron Machine started`
# step in .github/workflows/deploy.yml is the durable safety net.
[[restart]]
  policy = 'on-failure'
  retries = 10
  processes = ['app']

[[restart]]
  policy = 'always'
  retries = 10
  processes = ['cron']
