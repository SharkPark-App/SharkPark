# fly.toml — sharkpark-api (https://fly.io/apps/sharkpark-api)
#
# Two process groups, one image:
#   app  — Nest HTTP server, autostop enabled (min=0)
#   cron — supercronic running apps/backend/cron/crontab on a tiny
#          always-on VM. Fly's --schedule only supports hourly/daily/
#          weekly/monthly, so supercronic gives us proper cron granularity.
#
# Deploy from repo root: fly deploy --config apps/backend/fly.toml
# Reference: https://fly.io/docs/reference/configuration/

app = 'sharkpark-api'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # Migrations run from the GitHub Actions runner (see .github/workflows/deploy.yml)
  # before flyctl deploy. The CI runner has stable connectivity to Neon's pooler,
  # whereas the release_command machine on Fly intermittently fails to reach the
  # direct endpoint when the Neon compute is suspended. The deploy workflow's
  # concurrency group serializes deploys, so we don't need Prisma's advisory lock.
  strategy = 'rolling'

[env]
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'
  PORT = '3000'
  # Wall-clock crontab entries (e.g. '0 3 * * *') trigger at 3 AM PT.
  TZ = 'America/Los_Angeles'

[processes]
  app = 'node dist/main.js'
  cron = 'supercronic -passthrough-logs /app/apps/backend/cron/crontab'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # min=0 saves ~$5/mo but adds ~10s cold-start to the first request after
  # idle (measured 2026-04-26: 10.7s TTFB; warm p95 ~0.28s). Breakdown:
  # Fly boot + Node/Nest start + Prisma->Neon cold connect. Bump to 1 if
  # mobile users complain about latency. See docs/runbooks/runbook.md.
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    # Cold start (min_machines_running = 0) takes ~10-15s end-to-end:
    # Fly boot + Node + Nest module graph + Prisma connect to Neon. A 10s
    # grace tripped Fly Doctor's "App not listening on port 3000" alert
    # because the live probe fired before bootstrap finished. Match the
    # ready check (30s) so cold starts don't false-alarm.
    grace_period = '30s'
    method = 'GET'
    path = '/api/v1/health/live'
    protocol = 'http'

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/v1/health/ready'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  # 256MB OOM-kills snapshot.js / fetch-weather.js — they bootstrap the
  # full Nest application context (Prisma client + all modules) which
  # needs ~150-200MB heap + headroom. 512MB was the safe minimum for the
  # node-only crons. Bumped to 1024MB on 2026-04-30 ahead of the ML
  # prediction + retraining crons (predict-all-lots.ts, retrain-models.ts)
  # which spawn Python with xgboost + pandas; those reliably need 700MB+
  # in our local profiling and OOM-killed (exit 137) at 512MB.
  #
  # 2026-05-03 OOM cascade: at the top of the hour 5 */15 jobs (snapshot +
  # 4 notify-* triggers) all spawn simultaneously and each used to load the
  # full AppModule (~180MB RSS — pulled in the PassioGo WebSocket + Firebase
  # Admin + every other module, even though the script only needs Prisma +
  # one feature service). 5 × 180MB > 1GB → supercronic children got
  # OOM-killed, leaving zombie pg-pool connections and triggering
  # "Connection terminated due to connection timeout" on survivors.
  #
  # Fixed in PR #176 by switching cron scripts to per-script Nest modules
  # (`CronAppModule.withFeatures([...])` in src/scripts/_cron-app.module.ts)
  # so each bootstrap pulls in only the 1–2 feature modules it actually
  # invokes. Each cron now lands around ~60 MB RSS, so 5 concurrent ticks
  # comfortably fit under 500 MB and 1024MB is back to the right size for
  # the heaviest single job (predict-all-lots / retrain-models, which spawn
  # Python with xgboost + pandas and need ~700 MB).
  memory = '1024mb'
  processes = ['cron']
