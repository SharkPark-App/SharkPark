# SharkPark backend API — Fly.io app config
# https://fly.io/docs/reference/configuration/
#
# Two process groups, sharing one image:
#   app  — Nest HTTP server (autostop)
#   cron — supercronic running apps/backend/cron/crontab (always-on tiny VM)
#
# Build context: monorepo root.
#   fly deploy --config apps/backend/fly.toml --dockerfile apps/backend/Dockerfile

app = "sharkpark-api"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Run pending Prisma migrations against Neon before swapping in the new
  # release. `prisma` is a runtime dep so the CLI is available.
  release_command = "npx prisma migrate deploy"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  # Cron crontab uses wall-clock entries (e.g. `0 3 * * *`) interpreted
  # in PT. The HTTP server doesn't care about TZ. Single var is simplest.
  TZ = "America/Los_Angeles"

# Process groups — `fly deploy` creates one Machine per group.
[processes]
  app  = "node dist/main.js"
  cron = "supercronic -passthrough-logs /app/apps/backend/cron/crontab"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # min=0 saves ~$5/mo but adds ~3s cold-start to the first request after
  # idle. Bump to 1 if mobile users complain about latency.
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health/live"
    protocol = "http"

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/v1/health/ready"
    protocol = "http"

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# VM sizing per process group.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["cron"]
