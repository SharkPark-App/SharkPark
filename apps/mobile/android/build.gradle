buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        playServicesLocationVersion = "21.3.0"
        tslocationmanagerVersion = "4.0.+"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase / FCM — reads `android/app/google-services.json`
        // and generates the values resource consumed by the Firebase SDK.
        // Pinned to a stable release; bump in lockstep with @react-native-firebase
        // upgrades (the docs site lists the matching plugin version).
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"
