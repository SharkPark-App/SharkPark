# Codecov configuration
coverage:
  status:
    # Project coverage checks on PRs
    project:
      default:
        target: auto  # Compare to base branch
        threshold: 1% # Allow 1% decrease without failing
        base: auto
    # Patch coverage (new/changed code)
    patch:
      default:
        target: 70%   # New code should have 70% coverage

# PR comment configuration
comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false    # Always post comment
  require_base: false       # Don't require base report
  require_head: true        # Require head report
  hide_project_coverage: false  # Show project coverage (not just patch)
