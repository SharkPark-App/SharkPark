services:
  postgres:
    image: postgres:16-alpine
    container_name: sharkpark-postgres
    environment:
      POSTGRES_USER: sharkpark
      POSTGRES_PASSWORD: sharkpark
      POSTGRES_DB: sharkpark
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharkpark"]
      interval: 5s
      timeout: 2s
      retries: 10

  localstack:
    image: localstack/localstack
    container_name: sharkpark-localstack
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-west-2
      - EDGE_PORT=4566
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
