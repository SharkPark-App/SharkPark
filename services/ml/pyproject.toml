[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkpark-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.46.0",
    "pydantic>=2.0.0",
    "xgboost>=3.2.0",

    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "cuid2>=2.0.0",
    "boto3>=1.43.0",
    "botocore>=1.43.0",
    "mlflow>=3.11.1",
    "python-dotenv>=1.2.2",
    # D2 CSULB schedule scraper — public HTML only, no auth.
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # F-tier admin dashboard: rendered headless (Agg backend) by
    # scripts/validate_synthetic_v2.py to produce the synthetic-vs-real
    # overlay PNG embedded in /api/admin/ml-status/dashboard.
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]
